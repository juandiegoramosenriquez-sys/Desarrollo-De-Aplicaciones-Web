<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Información Personal</title>

    <!-- Bootstrap CSS por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f2f4f3;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .card-info {
            max-width: 550px;
            margin: 60px auto;
            border: 1px solid #1b4332;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card-info .card-header {
            background-color: #1b4332; /* verde oscuro */
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 20px;
            border-radius: 3px 3px 0 0;
        }

        .card-info .list-group-item {
            padding: 14px 24px;
            border-color: #d8e2dc;
        }

        .card-info .label {
            font-weight: 700;
            color: #1b4332;
            display: inline-block;
            width: 130px;
        }

        .card-info .value {
            color: #2b2b2b;
        }
    </style>
</head>
<body>

<div class="card card-info">
    <div class="card-header">
        INFORMACIÓN PERSONAL
    </div>
    <ul class="list-group list-group-flush">
        <li class="list-group-item">
            <span class="label">Nombre:</span> <span class="value" th:text="${nombre}"></span>
        </li>
        <li class="list-group-item">
            <span class="label">Apellido:</span> <span class="value" th:text="${apellido}"></span>
        </li>
        <li class="list-group-item">
            <span class="label">Dirección:</span> <span class="value" th:text="${direccion}"></span>
        </li>
        <li class="list-group-item">
            <span class="label">Correo:</span> <span class="value" th:text="${correo}"></span>
        </li>
        <li class="list-group-item">
            <span class="label">Número:</span> <span class="value" th:text="${numero}"></span>
        </li>
        <li class="list-group-item">
            <span class="label">Nacionalidad:</span> <span class="value" th:text="${nacionalidad}"></span>
        </li>
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
