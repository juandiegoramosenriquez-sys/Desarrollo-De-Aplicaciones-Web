<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Planes', ~{::section})}">
<body>
<section>
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 720px;">
        <h3 class="fw-bold mb-4" th:text="${plan.id == null} ? 'Nuevo plan' : 'Editar plan'"></h3>

        <form th:action="@{/planes/guardar}" th:object="${plan}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="estado">Estado</label>
                    <select class="form-select" th:field="*{estado}" th:errorclass="is-invalid">
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{estado}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="descripcion">Descripción <span class="text-muted small">(opcional)</span></label>
                    <textarea class="form-control" rows="2" th:field="*{descripcion}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="precio">Precio (S/)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{precio}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="duracionMeses">Duración (meses)</label>
                    <input type="number" class="form-control" th:field="*{duracionMeses}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{duracionMeses}"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/planes}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i>Guardar</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
