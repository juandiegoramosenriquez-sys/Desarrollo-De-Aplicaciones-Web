<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Planes', ~{::section})}">
<body>
<section>
    <div class="card shadow-sm p-4 mb-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-card-list text-success me-2"></i>Planes</h3>
                <p class="text-muted mb-0">Planes de entrenamiento y sus precios.</p>
            </div>
            <a th:href="@{/planes/nuevo}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Nuevo plan</a>
        </div>
    </div>

    <div class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Duración</th>
                    <th>Estado</th>
                    <th class="text-end pe-4">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(planes)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay planes registrados</td>
                </tr>
                <tr th:each="p : ${planes}">
                    <td class="ps-4 fw-bold" th:text="${p.id}"></td>
                    <td class="fw-semibold" th:text="${p.nombre}"></td>
                    <td th:text="${p.descripcion} ?: '—'"></td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${p.duracionMeses} + (${p.duracionMeses == 1} ? ' mes' : ' meses')"></td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${p.estado == 'ACTIVO'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${p.estado}"></span>
                    </td>
                    <td class="text-end pe-4 text-nowrap">
                        <a th:href="@{/planes/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/planes/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este plan?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
