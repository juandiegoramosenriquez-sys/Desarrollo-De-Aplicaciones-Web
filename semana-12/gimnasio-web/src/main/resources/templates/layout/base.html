<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Gimnasio'">Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border: 0; border-radius: 12px; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-heart-pulse-fill text-danger me-2"></i>Gimnasio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${titulo == 'Inicio'} ? 'active'" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${titulo == 'Socios'} ? 'active'" th:href="@{/socios}">Socios</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${titulo == 'Planes'} ? 'active'" th:href="@{/planes}">Planes</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${titulo == 'Membresias'} ? 'active'" th:href="@{/membresias}">Membresías</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
    </div>

    <div th:replace="${contenido}"></div>
</main>

<footer class="text-center text-muted small pb-4">
    Laboratorio 15 · Sistema de Gimnasio con Microservicios
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
