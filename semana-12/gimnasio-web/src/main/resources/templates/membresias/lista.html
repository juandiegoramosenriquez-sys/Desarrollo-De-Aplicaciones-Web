<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Membresias', ~{::section})}">
<body>
<section>
    <div class="card shadow-sm p-4 mb-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-calendar-check text-warning me-2"></i>Membresías</h3>
                <p class="text-muted mb-0">Relación de cada socio con su plan y su vigencia.</p>
            </div>
            <a th:href="@{/membresias/nuevo(idSocio=${idSocio})}" class="btn btn-warning"><i class="bi bi-plus-lg me-1"></i>Nueva membresía</a>
        </div>

        <form th:action="@{/membresias}" method="get" class="row g-2 align-items-end mt-3">
            <div class="col-md-6">
                <label class="form-label small text-muted" for="idSocio">Consultar membresías por socio</label>
                <select class="form-select" id="idSocio" name="idSocio">
                    <option value="">Todos los socios</option>
                    <option th:each="s : ${socios}" th:value="${s.id}" th:text="${s.dni} + ' - ' + ${s.nombreCompleto}"
                            th:selected="${s.id == idSocio}"></option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>Consultar</button>
                <a th:if="${idSocio != null}" th:href="@{/membresias}" class="btn btn-outline-secondary">Quitar filtro</a>
            </div>
        </form>
    </div>

    <div class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Socio</th>
                    <th>Plan</th>
                    <th>Fecha inicio</th>
                    <th>Fecha fin</th>
                    <th>Estado</th>
                    <th class="text-end pe-4">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(membresias)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay membresías registradas</td>
                </tr>
                <tr th:each="m : ${membresias}">
                    <td class="ps-4 fw-bold" th:text="${m.id}"></td>
                    <td th:text="${nombresSocios[m.idSocio]} ?: 'Socio #' + ${m.idSocio}"></td>
                    <td th:text="${nombresPlanes[m.idPlan]} ?: 'Plan #' + ${m.idPlan}"></td>
                    <td th:text="${#temporals.format(m.fechaInicio, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(m.fechaFin, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${m.estado == 'ACTIVA'} ? 'text-bg-success' : (${m.estado == 'CANCELADA'} ? 'text-bg-danger' : 'text-bg-secondary')"
                              th:text="${m.estado}"></span>
                    </td>
                    <td class="text-end pe-4 text-nowrap">
                        <a th:href="@{/membresias/{id}/editar(id=${m.id})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/membresias/{id}/eliminar(id=${m.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar esta membresía?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
