<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Aviso', ~{::section})}">
<body>
<section>
    <div class="card shadow-sm p-5 text-center">
        <i class="bi bi-exclamation-octagon text-danger display-4 mb-3"></i>
        <h4 class="fw-bold" th:text="'Error ' + ${status}">Error</h4>
        <p class="text-muted" th:text="${mensaje}"></p>
        <div>
            <a href="javascript:history.back()" class="btn btn-outline-secondary me-2">Volver</a>
            <a th:href="@{/}" class="btn btn-dark">Ir al inicio</a>
        </div>
    </div>
</section>
</body>
</html>
