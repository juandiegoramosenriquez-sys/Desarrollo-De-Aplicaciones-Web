<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Socios', ~{::section})}">
<body>
<section>
    <div class="card shadow-sm p-4 mb-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i>Socios</h3>
                <p class="text-muted mb-0">Personas inscritas en el gimnasio.</p>
            </div>
            <a th:href="@{/socios/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo socio</a>
        </div>
    </div>

    <div class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>DNI</th>
                    <th>Nombre completo</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th class="text-end pe-4">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(socios)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay socios registrados</td>
                </tr>
                <tr th:each="s : ${socios}">
                    <td class="ps-4 fw-bold" th:text="${s.id}"></td>
                    <td th:text="${s.dni}"></td>
                    <td th:text="${s.nombreCompleto}"></td>
                    <td th:text="${s.correo}"></td>
                    <td th:text="${s.telefono} ?: '—'"></td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${s.estado == 'ACTIVO'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${s.estado}"></span>
                    </td>
                    <td class="text-end pe-4 text-nowrap">
                        <a th:href="@{/membresias(idSocio=${s.id})}" class="btn btn-sm btn-outline-dark" title="Ver membresías"><i class="bi bi-calendar-check"></i></a>
                        <a th:href="@{/socios/{id}/editar(id=${s.id})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/socios/{id}/eliminar(id=${s.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este socio?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
