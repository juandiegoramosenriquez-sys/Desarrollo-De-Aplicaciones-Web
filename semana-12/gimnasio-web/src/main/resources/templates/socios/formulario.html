<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Socios', ~{::section})}">
<body>
<section>
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 720px;">
        <h3 class="fw-bold mb-4" th:text="${socio.id == null} ? 'Nuevo socio' : 'Editar socio'"></h3>

        <form th:action="@{/socios/guardar}" th:object="${socio}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="dni">DNI</label>
                    <input type="text" class="form-control" th:field="*{dni}" th:errorclass="is-invalid" maxlength="8">
                    <div class="invalid-feedback" th:errors="*{dni}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="correo">Correo</label>
                    <input type="email" class="form-control" th:field="*{correo}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{correo}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="nombres">Nombres</label>
                    <input type="text" class="form-control" th:field="*{nombres}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nombres}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="apellidos">Apellidos</label>
                    <input type="text" class="form-control" th:field="*{apellidos}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="telefono">Teléfono <span class="text-muted small">(opcional)</span></label>
                    <input type="text" class="form-control" th:field="*{telefono}" th:errorclass="is-invalid" maxlength="9">
                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="estado">Estado</label>
                    <select class="form-select" th:field="*{estado}" th:errorclass="is-invalid">
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{estado}"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/socios}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
