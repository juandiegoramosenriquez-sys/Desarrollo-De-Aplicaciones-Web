spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_membresia?useSSL=false&serverTimezone=America/Lima}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8083}

logging:
  level:
    root: WARN
    com.gimnasio: INFO

servicios:
  socio-url: ${SOCIO_URL:http://localhost:8081}
  plan-url: ${PLAN_URL:http://localhost:8082}
