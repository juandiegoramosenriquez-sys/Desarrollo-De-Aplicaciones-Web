spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_plan?useSSL=false&serverTimezone=America/Lima}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8082}

logging:
  level:
    root: WARN
    com.gimnasio: INFO
